<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MicroHelio</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>"
    />
    <script src="/src/js/tailwind-config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/src/css/common.css" />
    <link rel="stylesheet" href="/src/css/transactions.css" />
  </head>

  <body class="bg-bg-app">
    <div id="app-header-placeholder"></div>

    <div class="page-wrapper">
      <div class="page-content">
        <!-- Heading -->
        <div
          class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6"
        >
          <div>
            <h2 class="text-xl font-bold text-text-dark">
              Transaction History
            </h2>
            <p class="text-text-muted text-sm mt-0.5">
              All completed and pending energy transfer transactions
            </p>
          </div>
          <div class="flex items-center gap-3">
            <button
              onclick="loadTransactions()"
              class="btn btn-secondary btn-sm"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                />
              </svg>
              Refresh
            </button>
          </div>
        </div>

        <!-- Cards -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="stat-card">
            <div class="stat-label">Total Transactions</div>
            <div class="stat-value" id="stat-total">-</div>
            <div class="stat-sub">All time</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Completed</div>
            <div class="stat-value text-secondary" id="stat-completed">-</div>
            <div class="stat-sub">Energy transferred</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Pending Verify</div>
            <div class="stat-value text-accent" id="stat-pending">-</div>
            <div class="stat-sub">Awaiting QR scan</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Energy Total</div>
            <div class="stat-value text-primary" id="stat-energy">-</div>
            <div class="stat-sub">kWh transferred</div>
          </div>
        </div>

        <!-- Search & filter -->
        <div class="card mb-5">
          <div class="card-body py-4">
            <div class="flex flex-wrap gap-3 items-center">
              <div class="search-bar flex-1 min-w-48">
                <svg
                  class="w-4 h-4 text-text-muted flex-shrink-0"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                  />
                </svg>
                <input
                  type="text"
                  id="search-input"
                  placeholder="Search by prosumer NIC, node or code…"
                  oninput="filterTable()"
                />
              </div>
              <select
                id="filter-status"
                class="form-select"
                style="width: auto"
                onchange="filterTable()"
              >
                <option value="">All statuses</option>
                <option value="Initiated">Initiated</option>
                <option value="Verified">Verified</option>
                <option value="Completed">Completed</option>
                <option value="Failed">Failed</option>
              </select>
              <input
                type="date"
                id="filter-date"
                class="form-input"
                style="width: auto"
                onchange="filterTable()"
              />
              <button onclick="clearFilters()" class="btn btn-secondary btn-sm">
                Clear
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
