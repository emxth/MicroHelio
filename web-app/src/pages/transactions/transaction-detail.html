<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MicroHelio</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>"
    />
    <script src="/src/js/tailwind-config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/src/css/common.css" />
    <link rel="stylesheet" href="/src/css/transactions.css" />
  </head>

  <body class="bg-bg-app">
    <div id="app-header-placeholder"></div>

    <div class="page-wrapper">
      <div class="page-content">
        <!-- Back link + title -->
        <div class="flex items-center gap-3 mb-6">
          <a
            href="/src/pages/transactions/transaction-list.html"
            class="flex items-center gap-1.5 text-text-muted hover:text-primary text-sm font-medium transition-colors"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              />
            </svg>
            Transaction History
          </a>
          <span class="text-border">/</span>
          <span class="text-sm text-text-dark font-medium" id="breadcrumb-code"
            >Loading…</span
          >
        </div>

        <!-- Loading / Error state -->
        <div id="loading-state" class="card card-body text-center py-16">
          <div class="flex items-center justify-center gap-3 text-text-muted">
            <span class="spinner"></span>
            Loading transaction…
          </div>
        </div>

        <div id="error-state" class="hidden card card-body text-center py-16">
          <svg
            class="w-12 h-12 text-border mx-auto mb-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
            />
          </svg>
          <p class="text-text-dark font-semibold">Transaction not found</p>
          <p class="text-text-muted text-sm mt-1">
            The transaction ID in the URL is invalid or was removed.
          </p>
          <a
            href="/src/pages/transactions/transaction-list.html"
            class="btn btn-primary btn-sm mt-5"
            >Back to list</a
          >
        </div>

        <!-- Main detail content (hidden until loaded) -->
        <div id="detail-content" class="hidden space-y-5">
          <!-- Header card -->
          <div class="card">
            <div class="card-body">
              <div
                class="flex flex-col sm:flex-row sm:items-start justify-between gap-4"
              >
                <div>
                  <div class="flex items-center gap-3 mb-2">
                    <span id="detail-status-badge" class="badge"></span>
                    <span
                      class="text-text-muted text-sm"
                      id="detail-completed-at"
                    ></span>
                  </div>
                  <h2 class="text-xl font-bold text-text-dark" id="detail-code">
                    —
                  </h2>
                  <p
                    class="text-text-muted text-sm mt-1"
                    id="detail-created-at"
                  ></p>
                </div>
                <!-- Operator action: mark complete -->
                <div id="complete-action" class="hidden">
                  <button onclick="markComplete()" class="btn btn-success">
                    <svg
                      class="w-4 h-4"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M5 13l4 4L19 7"
                      />
                    </svg>
                    Confirm Transfer Complete
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
