<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link

    <link rel="stylesheet" href="/src/css/common.css" />

  <body class="min-h-screen flex" style="background: #f7faf7">
    <!-- Left panel -->
    <div

      style="
        background: linear-gradient(
          160deg,
          #1b2621 0%,
          #2d6a4f 60%,
          #3a8a68 100%
        );
      "
    >
      <a href="/index.html" class="flex items-center gap-3">
        <div

            fill="none"
            stroke="#1B2621"
            viewBox="0 0 24 24"
            stroke-width="2.5"

            <path

        </div>
        <span class="font-bold text-xl">MicroHelio</span>

        </p>
        <div class="mt-8 space-y-3">

              <svg
                class="w-3 h-3"
                fill="none"
                stroke="white"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"

          </div>
          <div class="flex items-center gap-3 text-green-100 text-sm">

            >
              <svg
                class="w-3 h-3"
                fill="none"
                stroke="white"

              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="3"
                  d="M5 13l4 4L19 7"

              </svg>
            </div>
            Secure QR energy transfer verification
          </div>
          <div class="flex items-center gap-3 text-green-100 text-sm">
            <div

            >
              <svg
                class="w-3 h-3"
                fill="none"
                stroke="white"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="3"
                  d="M5 13l4 4L19 7"
                />
              </svg>
            </div>
            Real-time booking and reservation management
          </div>
        </div>
