name: .NET Core CI

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./web-service

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore MicroHelio.sln

    - name: Build project
      run: dotnet build MicroHelio.sln --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test MicroHelio.sln --configuration Release --no-build --verbosity normal