name: .NET Core CI

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x' # Update this to match your project's target framework

    - name: Restore dependencies
      run: dotnet restore web-service/MicroHelio.sln # Update path if your .sln is elsewhere

    - name: Build project
      run: dotnet build web-service/MicroHelio.sln --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test web-service/MicroHelio.sln --configuration Release --no-build --verbosity normal